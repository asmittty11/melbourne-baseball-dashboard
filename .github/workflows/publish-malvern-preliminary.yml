name: Publish Malvern Preliminary Advance Scouting PDF
on:
  push:
    paths:
      - 'data/malvern_preliminary_nov24_2026.json'
      - 'scripts/generate_malvern_preliminary_pdf.py'
      - '.github/workflows/publish-malvern-preliminary.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install reportlab
      - run: python scripts/generate_malvern_preliminary_pdf.py
      - name: Commit preliminary scouting report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/Melbourne_vs_Malvern_Advance_Scouting_Preliminary_Nov24_2026.pdf text_reports/Melbourne_vs_Malvern_Advance_Scouting_Preliminary_Nov24_2026.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish preliminary Malvern Nov 24 scouting PDF"
            git push
          fi
