name: Publish Melbourne eight-game PDF
on:
  push:
    paths:
      - 'scripts/generate_melbourne_game8_pdf.py'
      - 'data/league_stats.json'
      - '.github/workflows/publish-melbourne-game8.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install reportlab
      - run: python scripts/generate_melbourne_game8_pdf.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/Melbourne_Season_Stats_Through_Game8_Sandringham_Updated.pdf text_reports/Melbourne_Season_Stats_Through_Game8_Sandringham_Updated.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish Melbourne eight-game season statistics PDF"
            git push
          fi
