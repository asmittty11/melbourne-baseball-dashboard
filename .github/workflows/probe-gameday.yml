name: Probe GameDay public stats access
on:
  push:
    paths:
      - 'scripts/probe_gameday.py'
      - '.github/workflows/probe-gameday.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - run: python scripts/probe_gameday.py
