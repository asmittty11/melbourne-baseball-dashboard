name: Publish Fitzroy Preliminary Advance Scouting PDF
on:
  push:
    paths:
      - 'data/fitzroy_preliminary_dec01_2026.json'
      - 'scripts/generate_fitzroy_preliminary_pdf.py'
      - '.github/workflows/publish-fitzroy-preliminary.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install reportlab
      - run: python scripts/generate_fitzroy_preliminary_pdf.py
      - name: Commit Fitzroy preliminary report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/Melbourne_vs_Fitzroy_Advance_Scouting_Preliminary_Dec01_2026.pdf text_reports/Melbourne_vs_Fitzroy_Advance_Scouting_Preliminary_Dec01_2026.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish Fitzroy Dec 1 preliminary scouting PDF"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
