name: Publish Melbourne 12-Player-Game Report (12 Official Games)
on:
  push:
    paths:
      - 'scripts/generate_melbourne_game12_pdf.py'
      - 'data/melbourne_game12_snapshot.json'
      - '.github/workflows/publish-melbourne-game12.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install reportlab
      - run: python scripts/generate_melbourne_game12_pdf.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/Melbourne_Season_Stats_Through_Game12_Malvern_Updated.pdf text_reports/Melbourne_Season_Stats_Through_Game12_Malvern_Updated.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish Melbourne twelve-batch stats through Malvern without duplicating official win"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
